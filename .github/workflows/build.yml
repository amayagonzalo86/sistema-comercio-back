name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TEMP pkginfo
        run: echo "::error title=pkginfo::$(npm view @nestjs/mapped-types@2 version dist.integrity peerDependencies dependencies --json | tail -c 3000 | tr -d '\n')"

      # Errores de TypeScript como anotaciones visibles en GitHub (archivo, línea y mensaje).
      - name: Type check
        run: |
          npx tsc --noEmit -p tsconfig.build.json --pretty false > tsc.log 2>&1 || true
          cat tsc.log
          if grep -q 'error TS' tsc.log; then
            echo "::error title=TypeScript::$(grep 'error TS' tsc.log | head -60 | sed -E 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Unit tests
        run: |
          npx jest --runInBand --json --outputFile=jest.json || status=$?
          node -e "
            const r = require('./jest.json');
            for (const s of r.testResults) {
              if (s.status !== 'passed' && s.message) console.log('::error file=' + s.name.replace(process.cwd() + '/', '') + '::' + s.message.replace(/\u001b\[[0-9;]*m/g, '').replace(/\r?\n/g, '%0A').slice(0, 3000));
              for (const t of s.assertionResults) if (t.status === 'failed') console.log('::error file=' + s.name.replace(process.cwd() + '/', '') + '::' + t.fullName + ': ' + t.failureMessages.join(' ').replace(/\u001b\[[0-9;]*m/g, '').replace(/\r?\n/g, '%0A').slice(0, 1500));
            }
          "
          exit ${status:-0}

      - run: npm run build

      # Integración contra MySQL real: recorre el flujo comercial completo por la API.
      - name: Integration tests (MySQL)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: erp_test
        run: |
          set -o pipefail
          npx jest --config test/jest-e2e.json --runInBand --ci 2>&1 | tee e2e.log || status=$?
          if [ "${status:-0}" != "0" ]; then
            echo "::error title=Integración::$(sed -E 's/\x1b\[[0-9;]*m//g' e2e.log | grep -v '^\s*at ' | grep -E -B2 -A25 '●|Error|error' | head -120 | sed -E 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit ${status:-0}

      # Vulnerabilidades en dependencias que llegan a producción: bloquean.
      - name: Audit (producción)
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e "
            const a = require('./audit.json');
            const v = Object.values(a.vulnerabilities || {}).filter(x => ['high', 'critical'].includes(x.severity));
            if (v.length) {
              const lines = v.map(x => x.name + ' ' + x.range + ' [' + x.severity + '] via ' + x.via.map(y => typeof y === 'string' ? y : (y.title + ' ' + (y.url || ''))).join(' | ') + ' fix: ' + JSON.stringify(x.fixAvailable));
              console.log('::error title=npm audit::' + lines.join('%0A'));
              process.exit(1);
            }
          "

      # Vulnerabilidades en herramientas de desarrollo: se informan sin bloquear.
      - name: Audit (desarrollo)
        continue-on-error: true
        run: npm audit --audit-level=high
