name: Actualizar dependencias vulnerables (temporal, no mergear)
on:
  push:
    branches: ['tmp/audit-fix-no-mergear']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit fix (producción)
        run: |
          npm ci --ignore-scripts
          npm audit fix --omit=dev --ignore-scripts || true
          LATEST=$(npm view multer version)
          echo "multer latest: $LATEST"
          npm pkg set "overrides.multer=$LATEST"
          npm install --ignore-scripts
          npm audit --omit=dev --json > audit.json || true
          node -e "const a=require('./audit.json');console.log(JSON.stringify(Object.fromEntries(Object.entries(a.vulnerabilities||{}).map(([k,v])=>[k,v.severity+' '+v.range]))))" | tee audit-summary.txt
          git diff --stat
      - name: Publicar
        run: |
          mkdir out && cp package.json package-lock.json audit-summary.txt out/
          cd out && git init -q -b tmp-audit-resultado && git config user.name bot && git config user.email bot@users.noreply.github.com && git add -A && git commit -qm deps && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-audit-resultado
