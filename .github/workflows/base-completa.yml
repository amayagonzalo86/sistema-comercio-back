name: Validar base completa (temporal, no mergear)
on:
  push:
    branches: ['tmp/base-completa-no-mergear']
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          TZ: America/Argentina/Buenos_Aires
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: sistema_comercio
      PORT: '3000'
      ALLOWED_ORIGINS: http://localhost:3001
      JWT_ACCESS_SECRET: test-access-secret-0123456789-abcdefghijklmnop
      JWT_REFRESH_SECRET: test-refresh-secret-0123456789-abcdefghijklmno
      ADMIN_BOOTSTRAP_PASSWORD: Admin-Comercio-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Cargar base completa (dos veces) y comparar esquema
        run: |
          M="mysql -h127.0.0.1 -uroot -proot"
          $M -e "SELECT @@global.time_zone, @@system_time_zone, NOW(), UTC_TIMESTAMP()"
          $M --default-character-set=utf8mb4 -e "source database/demo/base-completa.sql"
          $M --default-character-set=utf8mb4 -e "source database/demo/base-completa.sql"
          npx typeorm schema:log -d dist/database/data-source.js > schema.log 2>&1 || true
          tail -5 schema.log; grep -q 'Your schema is up to date' schema.log
      - name: Datos demo sentencia por sentencia en conexiones separadas (sin estado de sesión)
        run: |
          python3 - <<'PY'
          import subprocess
          sql = open('database/demo/datos-demo.sql', encoding='utf-8').read()
          stmts, buf = [], []
          for line in sql.split('\n'):
              if not buf and (line.startswith('--') or not line.strip()):
                  continue
              buf.append(line)
              if line.rstrip().endswith(';'):
                  stmts.append('\n'.join(buf)); buf = []
          print('sentencias', len(stmts))
          for i, st in enumerate(stmts):
              r = subprocess.run(['mysql','-h127.0.0.1','-uroot','-proot','--default-character-set=utf8mb4','sistema_comercio'], input=st.encode(), capture_output=True)
              if r.returncode:
                  print('FALLA', i, st[:200], r.stderr.decode()[:300]); raise SystemExit(1)
          print('OK todas')
          PY
      - name: Prueba de humo contra la API
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/v1/health >/dev/null && break; sleep 2; done
          node scripts/ci/smoke-demo.mjs || (tail -60 api.log; exit 1)
