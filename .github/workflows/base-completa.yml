name: Regenerar base completa (temporal, no mergear)
on:
  push:
    branches: ['tmp/base-completa-no-mergear']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          TZ: America/Argentina/Buenos_Aires
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: sistema_comercio
      PORT: '3000'
      ALLOWED_ORIGINS: http://localhost:3001
      JWT_ACCESS_SECRET: test-access-secret-0123456789-abcdefghijklmnop
      JWT_REFRESH_SECRET: test-refresh-secret-0123456789-abcdefghijklmno
      ADMIN_BOOTSTRAP_PASSWORD: Admin-Comercio-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Esquema real (synchronize)
        run: |
          M="mysql -h127.0.0.1 -uroot -proot"
          $M -e "CREATE DATABASE sistema_comercio CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/v1/health >/dev/null && break; sleep 2; done
          kill %1; sleep 2
          mysqldump -h127.0.0.1 -uroot -proot --skip-comments --skip-dump-date --set-gtid-purged=OFF --no-data --add-drop-table sistema_comercio > schema.sql
          python3 scripts/tmp/splice.py schema.sql
          mkdir out && cp database/demo/base-completa.sql out/
      - name: Cargar base completa dos veces en servidor vacío + schema:log
        run: |
          M="mysql -h127.0.0.1 -uroot -proot"
          $M -e "DROP DATABASE sistema_comercio"
          $M --default-character-set=utf8mb4 -e "source out/base-completa.sql"
          $M --default-character-set=utf8mb4 -e "source out/base-completa.sql"
          npx typeorm schema:log -d dist/database/data-source.js > schema.log 2>&1 || true
          tail -5 schema.log; grep -q 'Your schema is up to date' schema.log
      - name: Datos demo sentencia por sentencia en conexiones separadas
        run: |
          python3 - <<'PY'
          import subprocess
          sql = open('database/demo/datos-demo.sql', encoding='utf-8').read()
          stmts, buf = [], []
          for line in sql.split('\n'):
              if not buf and (line.startswith('--') or not line.strip()):
                  continue
              buf.append(line)
              if line.rstrip().endswith(';'):
                  stmts.append('\n'.join(buf)); buf = []
          print('sentencias', len(stmts))
          for i, st in enumerate(stmts):
              r = subprocess.run(['mysql','-h127.0.0.1','-uroot','-proot','--default-character-set=utf8mb4','sistema_comercio'], input=st.encode(), capture_output=True)
              if r.returncode:
                  print('FALLA', i, st[:200], r.stderr.decode()[:300]); raise SystemExit(1)
          print('OK todas')
          PY
      - name: Protección contra borrado de datos reales
        run: |
          M="mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4"
          $M sistema_comercio -e "UPDATE sales SET idempotency_key = 'real-venta-1' WHERE idempotency_key = (SELECT k FROM (SELECT MIN(idempotency_key) k FROM sales WHERE idempotency_key LIKE 'demo-sale-%') t)"
          if $M -e "source out/base-completa.sql" > guard1.log 2>&1; then echo "::error::base-completa no se detuvo"; exit 1; fi
          grep -q "base_con_datos_reales_no_se_borra_nada" guard1.log
          test "$($M sistema_comercio -N -e "SELECT COUNT(*) FROM sales WHERE idempotency_key = 'real-venta-1'")" = "1"
          if $M sistema_comercio -e "source database/demo/datos-demo.sql" > guard2.log 2>&1; then echo "::error::datos-demo no se detuvo"; exit 1; fi
          grep -q "demo_con_datos_reales_no_se_borra_nada" guard2.log
          test "$($M sistema_comercio -N -e "SELECT COUNT(*) FROM sales WHERE idempotency_key = 'real-venta-1'")" = "1"
          echo "Protección OK: ninguno de los dos scripts borró la venta real."
          $M sistema_comercio -e "UPDATE sales SET idempotency_key = 'demo-sale-restaurada' WHERE idempotency_key = 'real-venta-1'"
      - name: Prueba de humo contra la API
        run: |
          node dist/main.js > api2.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/v1/health >/dev/null && break; sleep 2; done
          node scripts/ci/smoke-demo.mjs || (tail -60 api2.log; exit 1)
      - name: Facturas de ejemplo
        run: |
          M="mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4"
          $M -e "source scripts/tmp/facturas-ejemplo.sql"
          test "$($M sistema_comercio -N -e "SELECT COUNT(*) FROM fiscal_documents WHERE status='AUTHORIZED'")" = "40"
          test "$($M sistema_comercio -N -e "SELECT COUNT(*) FROM sales WHERE fiscal_status='AUTHORIZED'")" = "40"
          $M -e "source scripts/tmp/facturas-ejemplo.sql"
          test "$($M sistema_comercio -N -e "SELECT COUNT(*) FROM fiscal_documents")" = "80"
          $M sistema_comercio -e "SELECT voucher_class, point_of_sale, COUNT(*), MIN(number), MAX(number) FROM fiscal_documents GROUP BY 1,2"
          if $M -e "source out/base-completa.sql" > guard3.log 2>&1; then echo "::error::no se detuvo con facturas"; exit 1; fi
          echo "Facturas de ejemplo OK y protección activa."
      - name: Publicar
        run: |
          cd out && git init -q -b tmp-base-completa-resultado && git config user.name bot && git config user.email bot@users.noreply.github.com && git add -A && git commit -qm sql && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-base-completa-resultado
